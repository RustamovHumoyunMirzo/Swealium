<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="580" viewBox="0 0 1040 580" role="img" aria-labelledby="title description">
<title id="title">Wrapping boundaries and proportional weight</title>
<desc id="description">Items wrap when the next item and gap exceed the finite content boundary. A second example shows one-share and two-share zero-basis weighted cells.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#6286ba"/></marker></defs>
<rect width="1040" height="580" fill="#f8fafc"/>
<g font-family="Segoe UI, Arial, sans-serif">
<text x="36" y="48" font-size="28" fill="#24364b" text-anchor="start" font-weight="700">Wrapping boundaries and proportional weight</text>
<text x="40" y="98" font-size="21" fill="#24364b" text-anchor="start" font-weight="600">Finite content boundary: 600 units</text><rect x="40" y="120" width="600" height="180" fill="#eef1f6" stroke="#6286ba" stroke-dasharray="7 6" stroke-width="2"/><rect x="54" y="134" width="180" height="58" rx="12" fill="#eaf2ff" stroke="#6286ba" stroke-width="2"/><text x="144.0" y="169.0" font-size="19" fill="#24364b" text-anchor="middle" font-weight="600">Item A</text><rect x="246" y="134" width="230" height="58" rx="12" fill="#eaf2ff" stroke="#6286ba" stroke-width="2"/><text x="361.0" y="169.0" font-size="19" fill="#24364b" text-anchor="middle" font-weight="600">Item B</text><rect x="54" y="218" width="270" height="58" rx="12" fill="#eaf2ff" stroke="#6286ba" stroke-width="2"/><text x="189.0" y="253.0" font-size="19" fill="#24364b" text-anchor="middle" font-weight="600">Item C wraps</text><rect x="336" y="218" width="180" height="58" rx="12" fill="#eaf2ff" stroke="#6286ba" stroke-width="2"/><text x="426.0" y="253.0" font-size="19" fill="#24364b" text-anchor="middle" font-weight="600">Item D</text><text x="682" y="156" font-size="19" fill="#24364b" text-anchor="start" font-weight="400">Gap: between items</text><text x="682" y="206" font-size="19" fill="#24364b" text-anchor="start" font-weight="400">LineGap: between rows</text><text x="40" y="348" font-size="21" fill="#24364b" text-anchor="start" font-weight="600">WeightBasis.Zero: divide space after gaps and minimum sizes</text><rect x="40" y="380" width="200" height="70" rx="12" fill="#e6f5ef" stroke="#4a9784" stroke-width="2"/><text x="140.0" y="421.0" font-size="19" fill="#24364b" text-anchor="middle" font-weight="600">Weight = 1</text><rect x="256" y="380" width="400" height="70" rx="12" fill="#e6f5ef" stroke="#4a9784" stroke-width="2"/><text x="456.0" y="421.0" font-size="19" fill="#24364b" text-anchor="middle" font-weight="600">Weight = 2</text><text x="40" y="492" font-size="19" fill="#24364b" text-anchor="start" font-weight="400">Content basis: add shares to intrinsic sizes. Zero basis: proportional cells.</text><text x="40" y="534" font-size="19" fill="#24364b" text-anchor="start" font-weight="400">Maximum constraints cap a child; remaining space redistributes to others.</text>
</g></svg>
