<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="580" viewBox="0 0 1040 580" role="img" aria-labelledby="title description">
<title id="title">Accessibility provider boundary</title>
<desc id="description">Widget metadata becomes semantic snapshots through AccessibilityHost. Applications implement the bridge to native accessibility services, and marshal actions back onto the UI thread. Native providers are not bundled.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#6286ba"/></marker></defs>
<rect width="1040" height="580" fill="#f8fafc"/>
<g font-family="Segoe UI, Arial, sans-serif">
<text x="36" y="48" font-size="28" fill="#24364b" text-anchor="start" font-weight="700">Accessibility provider boundary</text>
<rect x="40" y="130" width="280" height="90" rx="12" fill="#eaf2ff" stroke="#6286ba" stroke-width="2"/><text x="180.0" y="181.0" font-size="19" fill="#24364b" text-anchor="middle" font-weight="600">Widgets + semantic metadata</text><path d="M320 175 L380 175" fill="none" stroke="#6286ba" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="380" y="130" width="280" height="90" rx="12" fill="#eaf2ff" stroke="#6286ba" stroke-width="2"/><text x="520.0" y="181.0" font-size="19" fill="#24364b" text-anchor="middle" font-weight="600">AccessibilityHost</text><path d="M660 175 L720 175" fill="none" stroke="#6286ba" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="720" y="130" width="280" height="90" rx="12" fill="#eaf2ff" stroke="#6286ba" stroke-width="2"/><text x="860.0" y="181.0" font-size="19" fill="#24364b" text-anchor="middle" font-weight="600">Application bridge adapter</text><path d="M860 220 L860 330" fill="none" stroke="#6286ba" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="720" y="330" width="280" height="90" rx="12" fill="#eaf2ff" stroke="#6286ba" stroke-width="2"/><text x="860.0" y="381.0" font-size="19" fill="#24364b" text-anchor="middle" font-weight="600">Native accessibility service</text><text x="40" y="310" font-size="22" fill="#24364b" text-anchor="start" font-weight="400">Snapshots: roles, names, bounds, state, values</text><text x="40" y="355" font-size="22" fill="#24364b" text-anchor="start" font-weight="400">Actions: invoke, focus, edit, select, scroll</text><text x="40" y="485" font-size="22" fill="#24364b" text-anchor="start" font-weight="400">Swealium provides the host and adapter contract.</text><text x="40" y="530" font-size="20" fill="#24364b" text-anchor="start" font-weight="400">Applications supply UIA / AX / AT-SPI / mobile providers.</text>
</g></svg>
