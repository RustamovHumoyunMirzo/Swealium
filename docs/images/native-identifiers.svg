<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="580" viewBox="0 0 1040 580" role="img" aria-labelledby="title description">
<title id="title">Routing identity versus native interop</title>
<desc id="description">The portable routing ID is separate from a borrowed native handle descriptor with system kind, value, and optional display connection.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#6286ba"/></marker></defs>
<rect width="1040" height="580" fill="#f8fafc"/>
<g font-family="Segoe UI, Arial, sans-serif">
<text x="36" y="48" font-size="28" fill="#24364b" text-anchor="start" font-weight="700">Routing identity versus native interop</text>
<rect x="40" y="105" width="430" height="110" rx="12" fill="#eaf2ff" stroke="#6286ba" stroke-width="2"/><text x="255.0" y="166.0" font-size="19" fill="#24364b" text-anchor="middle" font-weight="600">window.Id : uint</text><text x="60" y="256" font-size="20" fill="#24364b" text-anchor="start" font-weight="400">Portable SDL event-routing identity.</text><text x="60" y="292" font-size="18" fill="#24364b" text-anchor="start" font-weight="400">Use for dispatch/logging, not OS calls.</text><rect x="560" y="105" width="440" height="110" rx="12" fill="#fff2d9" stroke="#bd8a35" stroke-width="2"/><text x="780.0" y="166.0" font-size="19" fill="#24364b" text-anchor="middle" font-weight="600">NativeWindowHandle</text><rect x="570" y="260" width="200" height="74" rx="12" fill="#fff2d9" stroke="#bd8a35" stroke-width="2"/><text x="670.0" y="303.0" font-size="19" fill="#24364b" text-anchor="middle" font-weight="600">Kind</text><rect x="790" y="260" width="200" height="74" rx="12" fill="#fff2d9" stroke="#bd8a35" stroke-width="2"/><text x="890.0" y="303.0" font-size="19" fill="#24364b" text-anchor="middle" font-weight="600">Value</text><rect x="570" y="360" width="420" height="70" rx="12" fill="#fff2d9" stroke="#bd8a35" stroke-width="2"/><text x="780.0" y="401.0" font-size="19" fill="#24364b" text-anchor="middle" font-weight="600">Display (X11 / Wayland)</text><text x="570" y="470" font-size="18" fill="#24364b" text-anchor="start" font-weight="400">Borrowed OS pointer or numeric identifier.</text><text x="570" y="502" font-size="18" fill="#24364b" text-anchor="start" font-weight="400">Query again before native use; never free.</text><text x="40" y="554" font-size="18" fill="#24364b" text-anchor="start" font-weight="400">One query API does not make HWND, X11 Window, and wl_surface interchangeable.</text>
</g></svg>
