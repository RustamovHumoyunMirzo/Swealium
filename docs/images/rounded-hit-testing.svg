<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="580" viewBox="0 0 1040 580" role="img" aria-labelledby="title description">
<title id="title">Asymmetric radii and hit regions</title>
<desc id="description">Four independent corner radii define a shared visible and analytic input shape. Red points in removed corners do not activate the widget.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#6286ba"/></marker></defs>
<rect width="1040" height="580" fill="#f8fafc"/>
<g font-family="Segoe UI, Arial, sans-serif">
<text x="36" y="48" font-size="28" fill="#24364b" text-anchor="start" font-weight="700">Asymmetric radii and hit regions</text>
<rect x="80" y="120" width="390" height="280" fill="#fbe9e6" stroke="#be493d" stroke-dasharray="8 6" stroke-width="2"/><path d="M180 120 H450 Q470 120 470 140 V320 Q470 400 390 400 H90 Q80 400 80 390 V220 Q80 120 180 120Z" fill="#dce9ff" stroke="#6286ba" stroke-width="3"/><circle cx="92" cy="132" r="8" fill="#be493d"/><circle cx="458" cy="388" r="8" fill="#be493d"/><circle cx="270" cy="250" r="8" fill="#2c8b76"/><text x="100" y="445" font-size="20" fill="#a23f35" text-anchor="start" font-weight="400">Red: cut-outs do not hover/click.</text><text x="100" y="479" font-size="20" fill="#287c69" text-anchor="start" font-weight="400">Green: inside the analytic shape.</text><text x="555" y="138" font-size="24" fill="#24364b" text-anchor="start" font-weight="600">Clockwise constructor order</text><text x="580" y="205" font-size="22" fill="#24364b" text-anchor="start" font-weight="400">1. Top-left</text><text x="580" y="250" font-size="22" fill="#24364b" text-anchor="start" font-weight="400">2. Top-right</text><text x="580" y="295" font-size="22" fill="#24364b" text-anchor="start" font-weight="400">3. Bottom-right</text><text x="580" y="340" font-size="22" fill="#24364b" text-anchor="start" font-weight="400">4. Bottom-left</text><text x="555" y="418" font-size="18" fill="#24364b" text-anchor="start" font-weight="400">Adjacent radii share one fit scale.</text><text x="555" y="452" font-size="18" fill="#24364b" text-anchor="start" font-weight="400">Drawing, clipping, and input agree.</text><text x="40" y="548" font-size="18" fill="#24364b" text-anchor="start" font-weight="400">Rounded parent clipping also excludes descendant input in the same cut-outs.</text>
</g></svg>
