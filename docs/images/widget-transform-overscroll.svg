<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="635" viewBox="0 0 1040 635" role="img" aria-labelledby="title description">
<title id="title">Render transforms and bounded scroll chaining</title>
<desc id="description">A transformed rounded widget is translated, scaled and rotated relative to an unchanged dashed layout slot. Inverse coordinate mapping keeps input aligned. Chain forwards unused wheel input, while Contain and None stop chaining. None suppresses boundary feedback.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#6286ba"/></marker></defs>
<rect width="1040" height="635" fill="#f8fafc"/>
<g font-family="Segoe UI, Arial, sans-serif">
<text x="36" y="48" font-size="28" fill="#24364b" text-anchor="start" font-weight="700">Render transforms and bounded scroll chaining</text>
<text x="40" y="105" font-size="23" fill="#24364b" text-anchor="start" font-weight="600">Layout stays fixed</text><rect x="60" y="150" width="260" height="120" rx="16" fill="none" stroke="#8d9db0" stroke-width="3" stroke-dasharray="8 6"/><g transform="translate(65 20) translate(190 210) rotate(16) scale(1.1 .85) translate(-190 -210)"><rect x="60" y="150" width="260" height="120" rx="16" fill="#dceaff" stroke="#6286ba" stroke-width="4"/><circle cx="100" cy="185" r="7" fill="#c66363"/></g><text x="40" y="350" font-size="22" fill="#24364b" text-anchor="start" font-weight="400">Scale → rotate → translate</text><text x="40" y="390" font-size="19" fill="#24364b" text-anchor="start" font-weight="400">Drawing and input share the same mapping.</text><text x="40" y="430" font-size="19" fill="#24364b" text-anchor="start" font-weight="400">The dashed layout slot does not move.</text><text x="560" y="105" font-size="23" fill="#24364b" text-anchor="start" font-weight="600">Wheel chaining is a behavior policy</text><rect x="560" y="145" width="420" height="65" rx="12" fill="#eaf2ff" stroke="#6286ba" stroke-width="2"/><text x="770.0" y="183.5" font-size="19" fill="#24364b" text-anchor="middle" font-weight="600">Chain: consume available input</text><path d="M770 210 L770 255" fill="none" stroke="#6286ba" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="560" y="255" width="420" height="65" rx="12" fill="#e6f5ef" stroke="#4a9784" stroke-width="2"/><text x="770.0" y="293.5" font-size="19" fill="#24364b" text-anchor="middle" font-weight="600">Pass only the remainder to the parent</text><rect x="560" y="365" width="420" height="65" rx="12" fill="#fff1d6" stroke="#b48a35" stroke-width="2"/><text x="770.0" y="403.5" font-size="19" fill="#24364b" text-anchor="middle" font-weight="600">Contain / None: stop at this container</text><text x="560" y="475" font-size="18" fill="#24364b" text-anchor="start" font-weight="400">Contain reports the boundary; None is silent.</text><text x="40" y="555" font-size="21" fill="#24364b" text-anchor="start" font-weight="400">Auto preserves existing routing, including focus ownership for nested lists.</text><text x="40" y="598" font-size="19" fill="#24364b" text-anchor="start" font-weight="400">Offsets remain bounded. No elastic displacement or bounce is added.</text>
</g></svg>
