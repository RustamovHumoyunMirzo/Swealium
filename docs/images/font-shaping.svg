<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="650" viewBox="0 0 1040 650" role="img" aria-labelledby="title description">
<title id="title">Font shaping and baseline metrics</title>
<desc id="description">File or system fonts are shaped with explicit OpenType features and variable axes into reusable glyph segments. A conceptual baseline diagram distinguishes font ascent and descent from visible ink bounds and advance width. Kerning changes pair spacing, ligatures and stylistic sets change glyphs, and variation axes select supported designs. Paragraph layout retains its bidi, fallback and editing role.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#6286ba"/></marker></defs>
<rect width="1040" height="650" fill="#f8fafc"/>
<g font-family="Segoe UI, Arial, sans-serif">
<text x="36" y="48" font-size="28" fill="#24364b" text-anchor="start" font-weight="700">Font shaping and baseline metrics</text>
<rect x="40" y="95" width="270" height="65" rx="12" fill="#eaf2ff" stroke="#6286ba" stroke-width="2"/><text x="175.0" y="133.5" font-size="19" fill="#24364b" text-anchor="middle" font-weight="600">File or system Font</text><path d="M310 128 L365 128" fill="none" stroke="#6286ba" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="365" y="95" width="310" height="65" rx="12" fill="#e6f5ef" stroke="#4a9784" stroke-width="2"/><text x="520.0" y="133.5" font-size="19" fill="#24364b" text-anchor="middle" font-weight="600">Shape: features + axes</text><path d="M675 128 L730 128" fill="none" stroke="#6286ba" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="730" y="95" width="270" height="65" rx="12" fill="#eaf2ff" stroke="#6286ba" stroke-width="2"/><text x="865.0" y="133.5" font-size="19" fill="#24364b" text-anchor="middle" font-weight="600">Cached ShapedText glyphs</text><rect x="40" y="215" width="600" height="325" rx="12" fill="#eef4ff" stroke="#6286ba" stroke-width="2"/><text x="340.0" y="383.5" font-size="19" fill="#24364b" text-anchor="middle" font-weight="600"></text><text x="65" y="250" font-size="22" fill="#24364b" text-anchor="start" font-weight="600">Baseline-relative drawing and font metrics</text><path d="M90 315 H610 M90 425 H610 M90 475 H610" fill="none" stroke="#99a7b6" stroke-width="1.5" stroke-dasharray="6 5"/><text x="140" y="425" font-size="80" fill="#466fb3" text-anchor="start" font-weight="400">Aldo gy</text><path d="M90 425 H610" stroke="#4a9784" stroke-width="2.5"/><text x="470" y="415" font-size="18" fill="#4a9784" text-anchor="start" font-weight="400">Baseline</text><path d="M110 315 V425 M100 315 H120 M100 425 H120 M110 425 V475 M100 475 H120" stroke="#b48a35" stroke-width="2"/><text x="65" y="370" font-size="16" fill="#24364b" text-anchor="start" font-weight="400">Ascent</text><text x="65" y="460" font-size="16" fill="#24364b" text-anchor="start" font-weight="400">Descent</text><text x="65" y="520" font-size="18" fill="#24364b" text-anchor="start" font-weight="400">Ink bounds and advance width are different measurements.</text><rect x="680" y="230" width="320" height="65" rx="12" fill="#fff2d9" stroke="#bd8a35" stroke-width="2"/><text x="840.0" y="268.5" font-size="19" fill="#24364b" text-anchor="middle" font-weight="600">kern: pair spacing</text><rect x="680" y="320" width="320" height="65" rx="12" fill="#fff2d9" stroke="#bd8a35" stroke-width="2"/><text x="840.0" y="358.5" font-size="19" fill="#24364b" text-anchor="middle" font-weight="600">liga / ss01: substitutions</text><rect x="680" y="410" width="320" height="65" rx="12" fill="#fff2d9" stroke="#bd8a35" stroke-width="2"/><text x="840.0" y="448.5" font-size="19" fill="#24364b" text-anchor="middle" font-weight="600">wght / wdth: variable axes</text><text x="40" y="585" font-size="19" fill="#24364b" text-anchor="start" font-weight="400">A font must contain the requested feature or axis. Prepared glyphs draw at any baseline.</text><text x="40" y="620" font-size="19" fill="#24364b" text-anchor="start" font-weight="400">TextLayout remains the paragraph, bidi, fallback and editing path.</text>
</g></svg>
