<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="580" viewBox="0 0 1040 580" role="img" aria-labelledby="title description">
<title id="title">Input routing and local coordinates</title>
<desc id="description">A pointer hit targets a nested button; events bubble to panel and root while local coordinates change and the window point remains constant.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#6286ba"/></marker></defs>
<rect width="1040" height="580" fill="#f8fafc"/>
<g font-family="Segoe UI, Arial, sans-serif">
<text x="36" y="48" font-size="28" fill="#24364b" text-anchor="start" font-weight="700">Input routing and local coordinates</text>
<rect x="55" y="105" width="470" height="370" rx="12" fill="#eaf2ff" stroke="#6286ba" stroke-width="2"/><text x="290.0" y="296.0" font-size="19" fill="#24364b" text-anchor="middle" font-weight="600"></text><text x="78" y="142" font-size="20" fill="#24364b" text-anchor="start" font-weight="600">Window: logical coordinates</text><rect x="105" y="175" width="365" height="242" rx="12" fill="#e6f5ef" stroke="#4a9784" stroke-width="2"/><text x="287.5" y="302.0" font-size="19" fill="#24364b" text-anchor="middle" font-weight="600"></text><text x="122" y="204" font-size="18" fill="#24364b" text-anchor="start" font-weight="400">Panel at (10, 20)</text><rect x="160" y="245" width="230" height="95" rx="12" fill="#eaf2ff" stroke="#6286ba" stroke-width="2"/><text x="275.0" y="298.5" font-size="19" fill="#24364b" text-anchor="middle" font-weight="600">Button at (5, 6)</text><circle cx="190" cy="280" r="7" fill="#be493d"/><text x="92" y="512" font-size="17" fill="#24364b" text-anchor="start" font-weight="400">Window point (20, 30) becomes button-local (5, 4).</text><text x="600" y="117" font-size="24" fill="#24364b" text-anchor="start" font-weight="600">Hit-test down; bubble up</text><rect x="620" y="160" width="350" height="70" rx="12" fill="#eaf2ff" stroke="#6286ba" stroke-width="2"/><text x="795.0" y="201.0" font-size="19" fill="#24364b" text-anchor="middle" font-weight="600">Root: ancestor</text><rect x="620" y="285" width="350" height="70" rx="12" fill="#eaf2ff" stroke="#6286ba" stroke-width="2"/><text x="795.0" y="326.0" font-size="19" fill="#24364b" text-anchor="middle" font-weight="600">Panel: parent</text><rect x="620" y="410" width="350" height="70" rx="12" fill="#eaf2ff" stroke="#6286ba" stroke-width="2"/><text x="795.0" y="451.0" font-size="19" fill="#24364b" text-anchor="middle" font-weight="600">Button: Source</text><path d="M795 285 L795 230" fill="none" stroke="#6286ba" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M795 410 L795 355" fill="none" stroke="#6286ba" stroke-width="2.5" marker-end="url(#arrow)"/><text x="600" y="525" font-size="17" fill="#24364b" text-anchor="start" font-weight="400">CurrentTarget changes; Position is local.</text><text x="600" y="550" font-size="17" fill="#24364b" text-anchor="start" font-weight="400">Handled stops later bubbling.</text>
</g></svg>
