<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="640" viewBox="0 0 1040 640" role="img" aria-labelledby="title description">
<title id="title">Immediate-mode batched canvas</title>
<desc id="description">Large data lives in a reusable point buffer and is drawn by one canvas widget. Scatter batches retain every sample; dense X-ordered polylines can use a cached screen-width min/max envelope preserving spikes. Exact detail remains available.</desc>
