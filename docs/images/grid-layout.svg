<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="580" viewBox="0 0 1040 580" role="img" aria-labelledby="title description">
<title id="title">Grid tracks and spanning cells</title>
<desc id="description">A content-sized spanning header sits above a fixed sidebar and a body spanning one-share and two-share fractional columns. Padding and gaps surround the track slots.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#6286ba"/></marker></defs>
<rect width="1040" height="580" fill="#f8fafc"/>
<g font-family="Segoe UI, Arial, sans-serif">
<text x="36" y="48" font-size="28" fill="#24364b" text-anchor="start" font-weight="700">Grid tracks and spanning cells</text>
<rect x="60" y="120" width="904" height="296" rx="12" fill="#eef1f6" stroke="#99a7b6" stroke-width="2"/><text x="512.0" y="274.0" font-size="19" fill="#24364b" text-anchor="middle" font-weight="600"></text><text x="160" y="98" font-size="19" fill="#24364b" text-anchor="middle" font-weight="600">Fixed: 160</text><text x="368" y="98" font-size="19" fill="#24364b" text-anchor="middle" font-weight="600">Fraction: 1</text><text x="720" y="98" font-size="19" fill="#24364b" text-anchor="middle" font-weight="600">Fraction: 2</text><rect x="80" y="140" width="864" height="60" rx="12" fill="#eaf2ff" stroke="#6286ba" stroke-width="2"/><text x="512.0" y="176.0" font-size="19" fill="#24364b" text-anchor="middle" font-weight="600">Content row — Header: GridColumnSpan = 3</text><rect x="80" y="216" width="160" height="180" rx="12" fill="#e6f5ef" stroke="#4a9784" stroke-width="2"/><text x="160.0" y="312.0" font-size="19" fill="#24364b" text-anchor="middle" font-weight="600">Sidebar</text><rect x="256" y="216" width="688" height="180" rx="12" fill="#e6f5ef" stroke="#4a9784" stroke-width="2"/><text x="600.0" y="312.0" font-size="19" fill="#24364b" text-anchor="middle" font-weight="600">Body: row 1, column 1, column span 2</text><path d="M480 216 V396" stroke="#6286ba" stroke-dasharray="7 6" stroke-width="2"/><text x="60" y="460" font-size="19" fill="#24364b" text-anchor="start" font-weight="400">Spans include internal gaps; margins are inside the complete cell slot.</text><text x="60" y="500" font-size="18" fill="#24364b" text-anchor="start" font-weight="400">Track limits constrain sizes. Fraction weights divide the remaining finite budget.</text><text x="60" y="540" font-size="17" fill="#24364b" text-anchor="start" font-weight="400">An undefined axis begins with one fractional track; extra implicit tracks size to content.</text>
</g></svg>
