<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="580" viewBox="0 0 1040 580" role="img" aria-labelledby="title description">
<title id="title">Application-to-pixel pipeline</title>
<desc id="description">Events route by portable window ID into logical layout and widget callbacks, then GPU submission or raster upload reaches SDL presentation.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#6286ba"/></marker></defs>
<rect width="1040" height="580" fill="#f8fafc"/>
<g font-family="Segoe UI, Arial, sans-serif">
<text x="36" y="48" font-size="28" fill="#24364b" text-anchor="start" font-weight="700">Application-to-pixel pipeline</text>
<rect x="40" y="100" width="280" height="76" rx="12" fill="#eaf2ff" stroke="#6286ba" stroke-width="2"/><text x="180.0" y="144.0" font-size="19" fill="#24364b" text-anchor="middle" font-weight="600">Native event queue</text><rect x="380" y="100" width="280" height="76" rx="12" fill="#eaf2ff" stroke="#6286ba" stroke-width="2"/><text x="520.0" y="144.0" font-size="19" fill="#24364b" text-anchor="middle" font-weight="600">Window ID routing</text><rect x="720" y="100" width="280" height="76" rx="12" fill="#eaf2ff" stroke="#6286ba" stroke-width="2"/><text x="860.0" y="144.0" font-size="19" fill="#24364b" text-anchor="middle" font-weight="600">Input + visual tree</text><path d="M320 138 L380 138" fill="none" stroke="#6286ba" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M660 138 L720 138" fill="none" stroke="#6286ba" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M860 176 L860 242" fill="none" stroke="#6286ba" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="40" y="245" width="280" height="76" rx="12" fill="#e6f5ef" stroke="#4a9784" stroke-width="2"/><text x="180.0" y="289.0" font-size="19" fill="#24364b" text-anchor="middle" font-weight="600">GPU / raster Skia surface</text><rect x="380" y="245" width="280" height="76" rx="12" fill="#e6f5ef" stroke="#4a9784" stroke-width="2"/><text x="520.0" y="289.0" font-size="19" fill="#24364b" text-anchor="middle" font-weight="600">Widget Draw callbacks</text><rect x="720" y="245" width="280" height="76" rx="12" fill="#e6f5ef" stroke="#4a9784" stroke-width="2"/><text x="860.0" y="289.0" font-size="19" fill="#24364b" text-anchor="middle" font-weight="600">Logical measure / arrange</text><path d="M720 283 L660 283" fill="none" stroke="#6286ba" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M380 283 L320 283" fill="none" stroke="#6286ba" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M180 321 L180 388" fill="none" stroke="#6286ba" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="40" y="390" width="280" height="76" rx="12" fill="#fff2d9" stroke="#bd8a35" stroke-width="2"/><text x="180.0" y="434.0" font-size="19" fill="#24364b" text-anchor="middle" font-weight="600">GPU submit / raster upload</text><rect x="380" y="390" width="280" height="76" rx="12" fill="#fff2d9" stroke="#bd8a35" stroke-width="2"/><text x="520.0" y="434.0" font-size="19" fill="#24364b" text-anchor="middle" font-weight="600">SDL presentation</text><rect x="720" y="390" width="280" height="76" rx="12" fill="#fff2d9" stroke="#bd8a35" stroke-width="2"/><text x="860.0" y="434.0" font-size="19" fill="#24364b" text-anchor="middle" font-weight="600">OS window / display</text><path d="M320 428 L380 428" fill="none" stroke="#6286ba" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M660 428 L720 428" fill="none" stroke="#6286ba" stroke-width="2.5" marker-end="url(#arrow)"/><text x="40" y="525" font-size="20" fill="#24364b" text-anchor="start" font-weight="400">One UI loop. Separate surface, backend, and input tree per window.</text><text x="40" y="554" font-size="17" fill="#24364b" text-anchor="start" font-weight="400">Layout is cached; visible frames currently render continuously.</text>
</g></svg>
