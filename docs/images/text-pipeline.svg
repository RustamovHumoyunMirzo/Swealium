<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="580" viewBox="0 0 1040 580" role="img" aria-labelledby="title description">
<title id="title">Shared text layout and IME editing</title>
<desc id="description">Plain text or HTML spans share shaping, bidi, fallback, wrapping, drawing, and caret geometry. The shared TextEditor keeps IME preedit separate until a committed event replaces the selection.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#6286ba"/></marker></defs>
<rect width="1040" height="580" fill="#f8fafc"/>
<g font-family="Segoe UI, Arial, sans-serif">
<text x="36" y="48" font-size="28" fill="#24364b" text-anchor="start" font-weight="700">Shared text layout and IME editing</text>
<rect x="40" y="104" width="280" height="70" rx="12" fill="#eaf2ff" stroke="#6286ba" stroke-width="2"/><text x="180.0" y="145.0" font-size="19" fill="#24364b" text-anchor="middle" font-weight="600">Plain text / HTML spans</text><path d="M320 139 L380 139" fill="none" stroke="#6286ba" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="380" y="104" width="280" height="70" rx="12" fill="#eaf2ff" stroke="#6286ba" stroke-width="2"/><text x="520.0" y="145.0" font-size="19" fill="#24364b" text-anchor="middle" font-weight="600">Shape + bidi + fallback</text><path d="M660 139 L720 139" fill="none" stroke="#6286ba" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="720" y="104" width="280" height="70" rx="12" fill="#eaf2ff" stroke="#6286ba" stroke-width="2"/><text x="860.0" y="145.0" font-size="19" fill="#24364b" text-anchor="middle" font-weight="600">Wrap + caret geometry</text><path d="M860 174 L860 234" fill="none" stroke="#6286ba" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="720" y="234" width="280" height="70" rx="12" fill="#eaf2ff" stroke="#6286ba" stroke-width="2"/><text x="860.0" y="275.0" font-size="19" fill="#24364b" text-anchor="middle" font-weight="600">DrawingContext / Text</text><rect x="40" y="234" width="280" height="70" rx="12" fill="#e6f5ef" stroke="#4a9784" stroke-width="2"/><text x="180.0" y="275.0" font-size="19" fill="#24364b" text-anchor="middle" font-weight="600">TextEditor: committed text</text><path d="M320 269 L380 269" fill="none" stroke="#6286ba" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="380" y="234" width="280" height="70" rx="12" fill="#e6f5ef" stroke="#4a9784" stroke-width="2"/><text x="520.0" y="275.0" font-size="19" fill="#24364b" text-anchor="middle" font-weight="600">Selection + undo + caret</text><path d="M660 269 L720 269" fill="none" stroke="#6286ba" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="40" y="380" width="280" height="70" rx="12" fill="#fff1d6" stroke="#b48a35" stroke-width="2"/><text x="180.0" y="421.0" font-size="19" fill="#24364b" text-anchor="middle" font-weight="600">Native IME preedit</text><path d="M320 415 L380 415" fill="none" stroke="#6286ba" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="380" y="380" width="280" height="70" rx="12" fill="#fff1d6" stroke="#b48a35" stroke-width="2"/><text x="520.0" y="421.0" font-size="19" fill="#24364b" text-anchor="middle" font-weight="600">Transient underlined text</text><path d="M660 415 L720 415" fill="none" stroke="#6286ba" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="720" y="380" width="280" height="70" rx="12" fill="#fff1d6" stroke="#b48a35" stroke-width="2"/><text x="860.0" y="421.0" font-size="19" fill="#24364b" text-anchor="middle" font-weight="600">Candidate popup</text><text x="40" y="508" font-size="20" fill="#24364b" text-anchor="start" font-weight="400">Preedit stays separate. A commit replaces the captured selection once.</text><text x="40" y="546" font-size="18" fill="#24364b" text-anchor="start" font-weight="400">The operating-system IME controls candidate navigation and conversion.</text>
</g></svg>
