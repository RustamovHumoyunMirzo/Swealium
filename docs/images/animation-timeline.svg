<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="625" viewBox="0 0 1040 625" role="img" aria-labelledby="title description">
<title id="title">Animator timeline and frame integration</title>
<desc id="description">Automatic animations advance on the UI thread after native events and before window rendering. The timeline shows an initial delay, a forward iteration, a held endpoint during repeat delay, and an auto-reversed iteration ending at From. Manual clocks advance explicitly; pause does not consume time.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#6286ba"/></marker></defs>
<rect width="1040" height="625" fill="#f8fafc"/>
<g font-family="Segoe UI, Arial, sans-serif">
<text x="36" y="48" font-size="28" fill="#24364b" text-anchor="start" font-weight="700">Animator timeline and frame integration</text>
<text x="40" y="100" font-size="22" fill="#24364b" text-anchor="start" font-weight="600">One UI clock: update values before the windows draw</text><rect x="40" y="125" width="270" height="65" rx="12" fill="#eaf2ff" stroke="#6286ba" stroke-width="2"/><text x="175.0" y="163.5" font-size="19" fill="#24364b" text-anchor="middle" font-weight="600">Native events</text><path d="M310 158 L365 158" fill="none" stroke="#6286ba" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="365" y="125" width="310" height="65" rx="12" fill="#e6f5ef" stroke="#4a9784" stroke-width="2"/><text x="520.0" y="163.5" font-size="19" fill="#24364b" text-anchor="middle" font-weight="600">AnimatorContext updates</text><path d="M675 158 L730 158" fill="none" stroke="#6286ba" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="730" y="125" width="270" height="65" rx="12" fill="#eaf2ff" stroke="#6286ba" stroke-width="2"/><text x="865.0" y="163.5" font-size="19" fill="#24364b" text-anchor="middle" font-weight="600">Render windows</text><text x="40" y="242" font-size="22" fill="#24364b" text-anchor="start" font-weight="600">Delay, forward leg, repeat delay, reversed leg</text><rect x="40" y="280" width="140" height="65" rx="12" fill="#eef1f6" stroke="#99a7b6" stroke-width="2"/><text x="110.0" y="318.5" font-size="19" fill="#24364b" text-anchor="middle" font-weight="600">Delay</text><rect x="180" y="280" width="340" height="65" rx="12" fill="#eaf2ff" stroke="#6286ba" stroke-width="2"/><text x="350.0" y="318.5" font-size="19" fill="#24364b" text-anchor="middle" font-weight="600">Iteration 0: From to To</text><rect x="520" y="280" width="140" height="65" rx="12" fill="#fff2d9" stroke="#bd8a35" stroke-width="2"/><text x="590.0" y="318.5" font-size="19" fill="#24364b" text-anchor="middle" font-weight="600">Hold To</text><rect x="660" y="280" width="340" height="65" rx="12" fill="#eaf2ff" stroke="#6286ba" stroke-width="2"/><text x="830.0" y="318.5" font-size="19" fill="#24364b" text-anchor="middle" font-weight="600">Iteration 1: To to From</text><path d="M40 470 H180 C280 470 420 385 520 385 H660 C760 385 900 470 1000 470" fill="none" stroke="#4a9784" stroke-width="4"/><text x="40" y="503" font-size="18" fill="#24364b" text-anchor="start" font-weight="400">From</text><text x="530" y="378" font-size="18" fill="#24364b" text-anchor="start" font-weight="400">To</text><text x="1000" y="503" font-size="18" fill="#24364b" text-anchor="end" font-weight="400">From</text><text x="40" y="550" font-size="19" fill="#24364b" text-anchor="start" font-weight="400">RepeatCount = 1, AutoReverse = true. Pause freezes time; Seek previews a leg.</text><text x="40" y="590" font-size="18" fill="#24364b" text-anchor="start" font-weight="400">Manual clock: Start(Manual), then Advance(delta). No SDL or worker timer required.</text>
</g></svg>
