<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="650" viewBox="0 0 1040 650" role="img" aria-labelledby="title description">
<title id="title">Stroke styles and focus precedence</title>
<desc id="description">Solid, dashed, dotted, double, and hidden borders follow rounded geometry. Neighboring colors blend through corners. An explicitly assigned stroke replaces automatic default and focus appearance until ResetStroke.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#6286ba"/></marker></defs>
<rect width="1040" height="650" fill="#f8fafc"/>
<g font-family="Segoe UI, Arial, sans-serif">
<text x="36" y="48" font-size="28" fill="#24364b" text-anchor="start" font-weight="700">Stroke styles and focus precedence</text>
<text x="40" y="88" font-size="22" fill="#24364b" text-anchor="start" font-weight="600">Solid</text><rect x="40" y="110" width="260" height="95" rx="22" fill="white" stroke="#466fb3" stroke-width="6" /><text x="370" y="88" font-size="22" fill="#24364b" text-anchor="start" font-weight="600">Dashed</text><rect x="370" y="110" width="260" height="95" rx="22" fill="white" stroke="#466fb3" stroke-width="6" stroke-dasharray="20 12"/><text x="700" y="88" font-size="22" fill="#24364b" text-anchor="start" font-weight="600">Dotted</text><rect x="700" y="110" width="260" height="95" rx="22" fill="white" stroke="#466fb3" stroke-width="6" stroke-dasharray="0 16" stroke-linecap="round"/><text x="40" y="268" font-size="22" fill="#24364b" text-anchor="start" font-weight="600">Double</text><rect x="40" y="290" width="260" height="95" rx="22" fill="white" stroke="#466fb3" stroke-width="6" /><rect x="43" y="293" width="254" height="89" rx="19" fill="none" stroke="white" stroke-width="2"/><text x="370" y="268" font-size="22" fill="#24364b" text-anchor="start" font-weight="600">Hidden</text><text x="370" y="342" font-size="19" fill="#24364b" text-anchor="start" font-weight="400">No border paint</text><text x="700" y="268" font-size="22" fill="#24364b" text-anchor="start" font-weight="600">Blended corners</text><defs><linearGradient id="corner-tl"><stop stop-color="#c66363"/><stop offset="1" stop-color="#466fb3"/></linearGradient><linearGradient id="corner-tr"><stop stop-color="#466fb3"/><stop offset="1" stop-color="#4a9784"/></linearGradient><linearGradient id="corner-br"><stop stop-color="#c39a3a"/><stop offset="1" stop-color="#4a9784"/></linearGradient><linearGradient id="corner-bl"><stop stop-color="#c66363"/><stop offset="1" stop-color="#c39a3a"/></linearGradient></defs><g fill="none" stroke-width="10"><path d="M722 290 H938" stroke="#466fb3"/><path d="M960 312 V363" stroke="#4a9784"/><path d="M938 385 H722" stroke="#c39a3a"/><path d="M700 363 V312" stroke="#c66363"/><path d="M700 312 Q700 290 722 290" stroke="url(#corner-tl)"/><path d="M938 290 Q960 290 960 312" stroke="url(#corner-tr)"/><path d="M960 363 Q960 385 938 385" stroke="url(#corner-br)"/><path d="M722 385 Q700 385 700 363" stroke="url(#corner-bl)"/></g><rect x="40" y="455" width="440" height="70" rx="12" fill="#eaf2ff" stroke="#6286ba" stroke-width="2"/><text x="260.0" y="496.0" font-size="19" fill="#24364b" text-anchor="middle" font-weight="600">Untouched: default / FocusStroke</text><rect x="550" y="455" width="440" height="70" rx="12" fill="#e6f5ef" stroke="#4a9784" stroke-width="2"/><text x="770.0" y="496.0" font-size="19" fill="#24364b" text-anchor="middle" font-weight="600">Stroke assigned: only that Stroke</text><text x="40" y="570" font-size="20" fill="#24364b" text-anchor="start" font-weight="400">An empty or Hidden explicit stroke also disables automatic focus borders.</text><text x="40" y="610" font-size="18" fill="#24364b" text-anchor="start" font-weight="400">ResetStroke() restores state-based defaults. Every border uses the same renderer.</text>
</g></svg>
