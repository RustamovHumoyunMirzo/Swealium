"19" fill="#24364b" text-anchor="middle" font-weight="600">B</text><rect x="65" y="231" width="380" height="31" rx="5" fill="#e6f5ef" stroke="#4a9784" stroke-width="2"/><text x="255.0" y="252.5" font-size="19" fill="#24364b" text-anchor="middle" font-weight="600">C</text><rect x="827" y="155" width="112" height="90" rx="5" fill="#e6f5ef" stroke="#4a9784" stroke-width="2"/><text x="883.0" y="206.0" font-size="19" fill="#24364b" text-anchor="middle" font-weight="600">C</text><text x="470" y="196" font-size="14" fill="#24364b" text-anchor="end" font-weight="400">gap</text><rect x="80" y="386" width="200" height="90" rx="12" fill="#eaf2ff" stroke="#6286ba" stroke-width="2"/><text x="180.0" y="437.0" font-size="19" fill="#24364b" text-anchor="middle" font-weight="600">A</text><rect x="190" y="415" width="200" height="82" rx="12" fill="#e6f5ef" stroke="#4a9784" stroke-width="2"/><text x="290.0" y="462.0" font-size="19" fill="#24364b" text-anchor="middle" font-weight="600">B / higher Z</text><rect x="575" y="384" width="110" height="50" rx="12" fill="#eaf2ff" stroke="#6286ba" stroke-width="2"/><text x="630.0" y="415.0" font-size="19" fill="#24364b" text-anchor="middle" font-weight="600">X=0, Y=0</text><rect x="737" y="435" width="230" height="55" rx="12" fill="#e6f5ef" stroke="#4a9784" stroke-width="2"/><text x="852.0" y="468.5" font-size="19" fill="#24364b" text-anchor="middle" font-weight="600">X=160, Y=50</text><text x="40" y="557" font-size="17" fill="#24364b" text-anchor="start" font-weight="400">Flow order follows insertion. Paint/hit order follows ZIndex. Only stacks use Gap/Grow.</text>
