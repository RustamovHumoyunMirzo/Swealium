<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="580" viewBox="0 0 1040 580" role="img" aria-labelledby="title description">
<title id="title">Four container layout modes</title>
<desc id="description">Vertical and horizontal stacks allocate sequential slots, overlay shares slots, absolute uses offsets; z order is independent.</desc>
