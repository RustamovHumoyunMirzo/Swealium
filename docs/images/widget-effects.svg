<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="690" viewBox="0 0 1040 690" role="img" aria-labelledby="title description">
<title id="title">Widget effect stack and backdrop transparency</title>
<desc id="description">Backdrop preparation runs before nested foreground filters. The first stack entry is the outer effect, applied to the inner effect&#x27;s completed subtree including overlay, stroke and outline. Transparent background color reveals blurred scene content; opaque color covers it. Progressive blur varies Gaussian radius through spatial stops, independently of widget opacity.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#6286ba"/></marker></defs>
<rect width="1040" height="690" fill="#f8fafc"/>
<g font-family="Segoe UI, Arial, sans-serif">
<text x="36" y="48" font-size="28" fill="#24364b" text-anchor="start" font-weight="700">Widget effect stack and backdrop transparency</text>
<rect x="40" y="95" width="960" height="62" rx="12" fill="#e6f5ef" stroke="#4a9784" stroke-width="2"/><text x="520.0" y="132.0" font-size="19" fill="#24364b" text-anchor="middle" font-weight="600">PrepareDraw: sample backdrop before foreground layers</text><rect x="40" y="190" width="960" height="220" rx="12" fill="#eef1f6" stroke="#99a7b6" stroke-width="2"/><text x="520.0" y="306.0" font-size="19" fill="#24364b" text-anchor="middle" font-weight="600"></text><text x="60" y="220" font-size="20" fill="#24364b" text-anchor="start" font-weight="600">A: outer effect scope</text><rect x="105" y="245" width="830" height="115" rx="12" fill="#eaf2ff" stroke="#6286ba" stroke-width="2"/><text x="520.0" y="308.5" font-size="19" fill="#24364b" text-anchor="middle" font-weight="600"></text><text x="125" y="274" font-size="20" fill="#24364b" text-anchor="start" font-weight="600">B: inner effect scope</text><rect x="160" y="295" width="720" height="45" rx="12" fill="#fff2d9" stroke="#bd8a35" stroke-width="2"/><text x="520.0" y="323.5" font-size="19" fill="#24364b" text-anchor="middle" font-weight="600">Draw / Children / Overlay / Stroke / Outline</text><text x="60" y="390" font-size="19" fill="#24364b" text-anchor="start" font-weight="400">B completes first; its output is filtered by A. Group opacity blends once.</text><text x="40" y="455" font-size="22" fill="#24364b" text-anchor="start" font-weight="600">Backdrop blur: background color alpha controls how much is revealed</text><defs><pattern id="stripes" width="14" height="14" patternUnits="userSpaceOnUse"><rect width="7" height="14" fill="#6393bd"/><rect x="7" width="7" height="14" fill="#c79566"/></pattern><filter id="blur"><feGaussianBlur stdDeviation="4"/></filter><clipPath id="glass"><rect x="40" y="480" width="450" height="95" rx="18"/></clipPath></defs><g clip-path="url(#glass)"><rect x="20" y="460" width="490" height="135" fill="url(#stripes)" filter="url(#blur)"/><rect x="40" y="480" width="450" height="95" rx="18" fill="white" fill-opacity=".2"/></g><rect x="550" y="480" width="450" height="95" rx="18" fill="white" stroke="#99a7b6"/><text x="265" y="535" font-size="20" fill="#24364b" text-anchor="middle" font-weight="600">Transparent: blurred scene visible</text><text x="775" y="535" font-size="20" fill="#24364b" text-anchor="middle" font-weight="600">Opaque: blurred scene covered</text><text x="40" y="620" font-size="20" fill="#24364b" text-anchor="start" font-weight="400">Progressive blur: sharp to soft, following spatial gradient stops.</text><text x="40" y="657" font-size="19" fill="#24364b" text-anchor="start" font-weight="400">Widget.Opacity fades the completed result; it never changes blur radius.</text>
</g></svg>
