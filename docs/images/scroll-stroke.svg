<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="580" viewBox="0 0 1040 580" role="img" aria-labelledby="title description">
<title id="title">Scrolling viewport and per-side strokes</title>
<desc id="description">A larger content extent is shifted behind a padded clipped viewport, with a vertical thumb. A second panel shows independently colored and sized border sides around rounded corners.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#6286ba"/></marker></defs>
<rect width="1040" height="580" fill="#f8fafc"/>
<g font-family="Segoe UI, Arial, sans-serif">
<text x="36" y="48" font-size="28" fill="#24364b" text-anchor="start" font-weight="700">Scrolling viewport and per-side strokes</text>
<rect x="40" y="105" width="570" height="320" rx="12" fill="#eaf2ff" stroke="#6286ba" stroke-width="2"/><text x="325.0" y="271.0" font-size="19" fill="#24364b" text-anchor="middle" font-weight="600"></text><text x="64" y="142" font-size="22" fill="#24364b" text-anchor="start" font-weight="600">Padded viewport: visible content</text><rect x="70" y="172" width="490" height="215" fill="#e6f5ef" stroke="#4a9784" stroke-width="2"/><path d="M70 172 H560 V490 H70 Z" fill="none" stroke="#4a9784" stroke-dasharray="8 6" stroke-width="2"/><rect x="82" y="186" width="460" height="52" rx="12" fill="#eaf2ff" stroke="#6286ba" stroke-width="2"/><text x="312.0" y="218.0" font-size="19" fill="#24364b" text-anchor="middle" font-weight="600">Row 4: translated by -Offset</text><rect x="82" y="250" width="460" height="52" rx="12" fill="#eaf2ff" stroke="#6286ba" stroke-width="2"/><text x="312.0" y="282.0" font-size="19" fill="#24364b" text-anchor="middle" font-weight="600">Row 5</text><text x="92" y="350" font-size="19" fill="#24364b" text-anchor="start" font-weight="400">Rows outside viewport are clipped.</text><rect x="576" y="172" width="14" height="215" rx="7" fill="#d8dfe9"/><rect x="576" y="228" width="14" height="65" rx="7" fill="#6286ba"/><text x="650" y="130" font-size="22" fill="#24364b" text-anchor="start" font-weight="600">Independent stroke sides</text><rect x="685" y="170" width="250" height="200" rx="24" fill="#ffffff"/><path d="M709 170 H911 Q935 170 935 194" fill="none" stroke="#587fd5" stroke-width="6"/><path d="M935 194 V346 Q935 370 911 370" fill="none" stroke="#4a9784" stroke-width="12"/><path d="M911 370 H709 Q685 370 685 346" fill="none" stroke="#c39a3a" stroke-width="16"/><path d="M685 346 V194 Q685 170 709 170" fill="none" stroke="#c66363" stroke-width="9"/><text x="810" y="258" font-size="18" fill="#24364b" text-anchor="middle" font-weight="400">Inside the rounded</text><text x="810" y="287" font-size="18" fill="#24364b" text-anchor="middle" font-weight="400">outer boundary</text><text x="650" y="420" font-size="17" fill="#24364b" text-anchor="start" font-weight="400">Stroke is decorative; padding is explicit.</text><text x="40" y="532" font-size="19" fill="#24364b" text-anchor="start" font-weight="400">Bars can reserve gutters, overlay content, or be hidden for external custom controls.</text>
</g></svg>
