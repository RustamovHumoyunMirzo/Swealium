<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="580" viewBox="0 0 1040 580" role="img" aria-labelledby="title description">
<title id="title">Layout box model</title>
<desc id="description">Nested regions distinguish container padding, a child&#x27;s outer margin, its actual border box, and its own content area.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#6286ba"/></marker></defs>
<rect width="1040" height="580" fill="#f8fafc"/>
<g font-family="Segoe UI, Arial, sans-serif">
<text x="36" y="48" font-size="28" fill="#24364b" text-anchor="start" font-weight="700">Layout box model</text>
<rect x="42" y="96" width="956" height="414" rx="12" fill="#eef1f6" stroke="#99a7b6" stroke-width="2"/><text x="520.0" y="309.0" font-size="19" fill="#24364b" text-anchor="middle" font-weight="600"></text><text x="66" y="126" font-size="20" fill="#24364b" text-anchor="start" font-weight="600">Container border box</text><rect x="140" y="157" width="750" height="310" rx="10" fill="#d7eee7" stroke="#4a9784" stroke-width="2"/><text x="160" y="185" font-size="19" fill="#24364b" text-anchor="start" font-weight="400">Container padding</text><rect x="250" y="205" width="530" height="224" rx="10" fill="#fff2d9" stroke="#bd8a35" stroke-width="2" stroke-dasharray="8 5"/><text x="270" y="232" font-size="18" fill="#24364b" text-anchor="start" font-weight="400">Child margin (outside)</text><rect x="300" y="250" width="430" height="140" rx="18" fill="#dce9ff" stroke="#6286ba" stroke-width="2"/><text x="515" y="280" font-size="19" fill="#24364b" text-anchor="middle" font-weight="600">Child Bounds / actual size</text><rect x="345" y="302" width="340" height="58" rx="8" fill="#ffffff" stroke="#4a9784" stroke-width="2"/><text x="515" y="337" font-size="18" fill="#24364b" text-anchor="middle" font-weight="400">Child content (inside padding)</text><text x="42" y="546" font-size="18" fill="#24364b" text-anchor="start" font-weight="400">DesiredSize includes margin. ActualWidth/Height include padding, but exclude margin.</text>
</g></svg>
