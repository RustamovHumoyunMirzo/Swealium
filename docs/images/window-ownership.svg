<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="580" viewBox="0 0 1040 580" role="img" aria-labelledby="title description">
<title id="title">Window ownership and modality</title>
<desc id="description">Two independent editors exist; one owns tools and a nested modal chain. Only its group is blocked and closing it destroys descendants before their owner.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#6286ba"/></marker></defs>
<rect width="1040" height="580" fill="#f8fafc"/>
<g font-family="Segoe UI, Arial, sans-serif">
<text x="36" y="48" font-size="28" fill="#24364b" text-anchor="start" font-weight="700">Window ownership and modality</text>
<rect x="55" y="105" width="380" height="80" rx="12" fill="#eaf2ff" stroke="#6286ba" stroke-width="2"/><text x="245.0" y="151.0" font-size="19" fill="#24364b" text-anchor="middle" font-weight="600">Independent editor A</text><rect x="55" y="280" width="170" height="72" rx="12" fill="#eaf2ff" stroke="#6286ba" stroke-width="2"/><text x="140.0" y="322.0" font-size="19" fill="#24364b" text-anchor="middle" font-weight="600">Owned tools</text><rect x="265" y="280" width="170" height="72" rx="12" fill="#fff2d9" stroke="#bd8a35" stroke-width="2"/><text x="350.0" y="322.0" font-size="19" fill="#24364b" text-anchor="middle" font-weight="600">Modal dialog</text><rect x="265" y="420" width="170" height="72" rx="12" fill="#fff2d9" stroke="#bd8a35" stroke-width="2"/><text x="350.0" y="462.0" font-size="19" fill="#24364b" text-anchor="middle" font-weight="600">Nested dialog</text><path d="M150 185 L140 280" fill="none" stroke="#6286ba" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M340 185 L350 280" fill="none" stroke="#6286ba" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M350 352 L350 420" fill="none" stroke="#6286ba" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="590" y="105" width="390" height="80" rx="12" fill="#eaf2ff" stroke="#6286ba" stroke-width="2"/><text x="785.0" y="151.0" font-size="19" fill="#24364b" text-anchor="middle" font-weight="600">Independent editor B</text><text x="590" y="239" font-size="18" fill="#24364b" text-anchor="start" font-weight="400">Own tree, input, surface, and renderer.</text><text x="590" y="279" font-size="18" fill="#24364b" text-anchor="start" font-weight="400">Unaffected by editor A&#x27;s modality.</text><text x="590" y="359" font-size="18" fill="#a23f35" text-anchor="start" font-weight="400">Closing A destroys descendants first.</text><text x="590" y="399" font-size="18" fill="#24364b" text-anchor="start" font-weight="400">B remains alive until separately closed.</text><text x="55" y="548" font-size="18" fill="#24364b" text-anchor="start" font-weight="400">Ownership is a separate native-window tree, not the widget visual tree.</text>
</g></svg>
