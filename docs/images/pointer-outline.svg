<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="610" viewBox="0 0 1040 610" role="img" aria-labelledby="title description">
<title id="title">Uniform outline and pointer-transparent overlays</title>
<desc id="description">A single-width rounded outline sits beyond the widget with a visible offset gap. A transparent ghost overlay lets a pointer target the lower widget. ConsumePointer true targets the top visual; false skips its entire pointer subtree. Ancestor clips and event Handled remain independent.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#6286ba"/></marker></defs>
<rect width="1040" height="610" fill="#f8fafc"/>
<g font-family="Segoe UI, Arial, sans-serif">
<text x="36" y="48" font-size="28" fill="#24364b" text-anchor="start" font-weight="700">Uniform outline and pointer-transparent overlays</text>
<text x="40" y="105" font-size="22" fill="#24364b" text-anchor="start" font-weight="600">One width, following the rounded boundary</text><rect x="44" y="144" width="362" height="212" rx="40" fill="none" stroke="#9167d8" stroke-width="8"/><rect x="60" y="160" width="330" height="180" rx="24" fill="#dceaff" stroke="#6286ba" stroke-width="2"/><text x="225" y="242" font-size="23" fill="#24364b" text-anchor="middle" font-weight="600">Widget bounds</text><path d="M225 148 V160 M217 148 H233 M217 160 H233" stroke="#b48a35" stroke-width="2"/><text x="245" y="135" font-size="18" fill="#24364b" text-anchor="start" font-weight="400">Offset: gap</text><text x="55" y="405" font-size="19" fill="#24364b" text-anchor="start" font-weight="400">Outline stays outside the owner clip.</text><text x="55" y="445" font-size="18" fill="#24364b" text-anchor="start" font-weight="400">Margin/layout/hit regions stay unchanged.</text><text x="570" y="105" font-size="22" fill="#24364b" text-anchor="start" font-weight="600">ConsumePointer controls targeting</text><rect x="605" y="220" width="340" height="76" rx="12" fill="#eaf2ff" stroke="#6286ba" stroke-width="2"/><text x="775.0" y="264.0" font-size="19" fill="#24364b" text-anchor="middle" font-weight="600">Lower target widget</text><rect x="580" y="175" width="390" height="165" rx="18" fill="#e6f5ef" fill-opacity=".35" stroke="#4a9784" stroke-width="3" stroke-dasharray="9 6"/><text x="600" y="205" font-size="19" fill="#24364b" text-anchor="start" font-weight="600">Ghost overlay</text><path d="M900 120 L900 255" fill="none" stroke="#4a9784" stroke-width="2.5" marker-end="url(#arrow)"/><text x="580" y="405" font-size="19" fill="#24364b" text-anchor="start" font-weight="400">false: target the widget underneath</text><text x="580" y="445" font-size="19" fill="#24364b" text-anchor="start" font-weight="400">true: target the top widget</text><text x="40" y="530" font-size="19" fill="#24364b" text-anchor="start" font-weight="400">Ancestor clips still apply. Outline supports Solid, Dashed, Dotted, Double, Hidden.</text><text x="40" y="575" font-size="19" fill="#24364b" text-anchor="start" font-weight="400">Ghost policy affects pointer targets; ancestor bubbling still uses Handled.</text>
</g></svg>
