<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="660" viewBox="0 0 1040 660" role="img" aria-labelledby="title description">
<title id="title">Collection-driven list and nested focus</title>
<desc id="description">A C# collection passes each item and index through a widget factory. Generated rows share a clipped List viewport and customizable scrollbar. Nested wheel ownership follows focus and stays with the focused list at its boundary.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#6286ba"/></marker></defs>
<rect width="1040" height="660" fill="#f8fafc"/>
<g font-family="Segoe UI, Arial, sans-serif">
<text x="36" y="48" font-size="28" fill="#24364b" text-anchor="start" font-weight="700">Collection-driven list and nested focus</text>
<rect x="40" y="100" width="280" height="70" rx="12" fill="#eaf2ff" stroke="#6286ba" stroke-width="2"/><text x="180.0" y="141.0" font-size="19" fill="#24364b" text-anchor="middle" font-weight="600">C# collection / source</text><path d="M320 135 L380 135" fill="none" stroke="#6286ba" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="380" y="100" width="280" height="70" rx="12" fill="#eaf2ff" stroke="#6286ba" stroke-width="2"/><text x="520.0" y="141.0" font-size="19" fill="#24364b" text-anchor="middle" font-weight="600">Item + index → factory</text><path d="M660 135 L720 135" fill="none" stroke="#6286ba" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="720" y="100" width="280" height="70" rx="12" fill="#eaf2ff" stroke="#6286ba" stroke-width="2"/><text x="860.0" y="141.0" font-size="19" fill="#24364b" text-anchor="middle" font-weight="600">Distinct widget per row</text><rect x="40" y="225" width="580" height="300" rx="12" fill="#eaf2ff" stroke="#6286ba" stroke-width="2"/><text x="330.0" y="381.0" font-size="19" fill="#24364b" text-anchor="middle" font-weight="600"></text><text x="62" y="260" font-size="22" fill="#24364b" text-anchor="start" font-weight="600">List: its own clipped viewport</text><rect x="64" y="280" width="500" height="53" rx="12" fill="#e6f5ef" stroke="#4a9784" stroke-width="2"/><text x="314.0" y="312.5" font-size="19" fill="#24364b" text-anchor="middle" font-weight="600">Row 1: data + template arguments</text><rect x="64" y="345" width="500" height="53" rx="12" fill="#e6f5ef" stroke="#4a9784" stroke-width="2"/><text x="314.0" y="377.5" font-size="19" fill="#24364b" text-anchor="middle" font-weight="600">Row 2: data + template arguments</text><rect x="64" y="410" width="500" height="53" rx="12" fill="#e6f5ef" stroke="#4a9784" stroke-width="2"/><text x="314.0" y="442.5" font-size="19" fill="#24364b" text-anchor="middle" font-weight="600">Row 3: data + template arguments</text><rect x="582" y="280" width="14" height="185" rx="7" fill="#d6e1ed"/><rect x="582" y="300" width="14" height="55" rx="7" fill="#6286ba"/><text x="64" y="500" font-size="18" fill="#24364b" text-anchor="start" font-weight="400">Style, hide, overlay, or replace the scrollbar.</text><text x="665" y="255" font-size="22" fill="#24364b" text-anchor="start" font-weight="600">Nested scrolling follows focus</text><rect x="665" y="285" width="335" height="70" rx="12" fill="#eaf2ff" stroke="#6286ba" stroke-width="2"/><text x="832.5" y="326.0" font-size="19" fill="#24364b" text-anchor="middle" font-weight="600">Focus a row / list → scroll list</text><rect x="665" y="380" width="335" height="70" rx="12" fill="#eaf2ff" stroke="#6286ba" stroke-width="2"/><text x="832.5" y="421.0" font-size="19" fill="#24364b" text-anchor="middle" font-weight="600">Focus outer → scroll outer</text><text x="665" y="498" font-size="17" fill="#24364b" text-anchor="start" font-weight="400">At an inner boundary, focus stays put.</text><text x="40" y="585" font-size="20" fill="#24364b" text-anchor="start" font-weight="400">Observable collections refresh automatically; ordinary lists use Refresh().</text><text x="40" y="625" font-size="18" fill="#24364b" text-anchor="start" font-weight="400">Rows are retained. Give the list a finite viewport to create overflow.</text>
</g></svg>
