<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="580" viewBox="0 0 1040 580" role="img" aria-labelledby="title description">
<title id="title">Raster, vector, and cursor ownership</title>
<desc id="description">Raster inputs become owned Bitmaps used by Image or DrawBitmap. SVG or drawing becomes owned VectorImage recordings used by VectorGraphics or DrawVector. Rasterization allows vector-based bitmap cursors. Widgets borrow resources, and custom cursors copy source pixels.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#6286ba"/></marker></defs>
<rect width="1040" height="580" fill="#f8fafc"/>
<g font-family="Segoe UI, Arial, sans-serif">
<text x="36" y="48" font-size="28" fill="#24364b" text-anchor="start" font-weight="700">Raster, vector, and cursor ownership</text>
<rect x="40" y="105" width="280" height="80" rx="12" fill="#eaf2ff" stroke="#6286ba" stroke-width="2"/><text x="180.0" y="151.0" font-size="19" fill="#24364b" text-anchor="middle" font-weight="600">Raster files / RGBA pixels</text><rect x="380" y="105" width="280" height="80" rx="12" fill="#eaf2ff" stroke="#6286ba" stroke-width="2"/><text x="520.0" y="151.0" font-size="19" fill="#24364b" text-anchor="middle" font-weight="600">SVG / SVGZ / drawing</text><path d="M180 185 L180 250" fill="none" stroke="#6286ba" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M520 185 L520 250" fill="none" stroke="#6286ba" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="40" y="250" width="280" height="80" rx="12" fill="#e6f5ef" stroke="#4a9784" stroke-width="2"/><text x="180.0" y="296.0" font-size="19" fill="#24364b" text-anchor="middle" font-weight="600">Bitmap owns pixels</text><rect x="380" y="250" width="280" height="80" rx="12" fill="#e6f5ef" stroke="#4a9784" stroke-width="2"/><text x="520.0" y="296.0" font-size="19" fill="#24364b" text-anchor="middle" font-weight="600">VectorImage owns recording</text><path d="M180 330 L180 395" fill="none" stroke="#6286ba" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M520 330 L520 395" fill="none" stroke="#6286ba" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="40" y="395" width="280" height="80" rx="12" fill="#eaf2ff" stroke="#6286ba" stroke-width="2"/><text x="180.0" y="441.0" font-size="19" fill="#24364b" text-anchor="middle" font-weight="600">Image / DrawBitmap</text><rect x="380" y="395" width="280" height="80" rx="12" fill="#eaf2ff" stroke="#6286ba" stroke-width="2"/><text x="520.0" y="441.0" font-size="19" fill="#24364b" text-anchor="middle" font-weight="600">VectorGraphics / DrawVector</text><path d="M660 290 L730 290" fill="none" stroke="#6286ba" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="730" y="250" width="270" height="80" rx="12" fill="#eaf2ff" stroke="#6286ba" stroke-width="2"/><text x="865.0" y="296.0" font-size="19" fill="#24364b" text-anchor="middle" font-weight="600">Rasterize → bitmap</text><path d="M865 330 L865 395" fill="none" stroke="#6286ba" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="730" y="395" width="270" height="80" rx="12" fill="#eaf2ff" stroke="#6286ba" stroke-width="2"/><text x="865.0" y="441.0" font-size="19" fill="#24364b" text-anchor="middle" font-weight="600">Cursor.FromBitmap</text><text x="40" y="525" font-size="20" fill="#24364b" text-anchor="start" font-weight="400">Widgets borrow resources. Dispose the owner after its last consumer finishes.</text><text x="40" y="560" font-size="18" fill="#24364b" text-anchor="start" font-weight="400">Cursors snapshot pixels; native handles follow the UI host lifetime.</text>
</g></svg>
