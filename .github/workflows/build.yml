name: Build and smoke test
on:
  push:
  pull_request:
  workflow_call:
    inputs:
      ref:
        description: Exact source ref to validate before publishing
        required: false
        type: string
permissions:
  contents: read
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - run: dotnet build -c Release
      - name: Check API reference and documentation
        run: |
          dotnet run --project tools/Swealium.Docs -c Release --no-build -- --check
          python tools/generate_doc_diagrams.py --check
          python tools/check_docs.py
      - name: Run rendering and input integration tests
        run: dotnet run --project tests/Swealium.Tests -c Release --no-build
        env:
          SDL_VIDEO_DRIVER: dummy
          SDL_RENDER_DRIVER: software
      - name: Render three frames (headless SDL software renderer)
        run: dotnet run --project samples/Swealium.Sample -c Release --no-build -- --smoke-test
        env:
          SDL_VIDEO_DRIVER: dummy
          SDL_RENDER_DRIVER: software
      - name: Render shaped text and editor demo
        run: dotnet run --project samples/Swealium.Sample -c Release --no-build -- --text-demo --smoke-test
        env:
          SDL_VIDEO_DRIVER: dummy
          SDL_RENDER_DRIVER: software
      - name: Render scroll and stroke demo
        run: dotnet run --project samples/Swealium.Sample -c Release --no-build -- --scroll-demo --smoke-test
        env:
          SDL_VIDEO_DRIVER: dummy
          SDL_RENDER_DRIVER: software
      - name: Render bitmap, vector, and cursor demo
        run: dotnet run --project samples/Swealium.Sample -c Release --no-build -- --media-demo --smoke-test
        env:
          SDL_VIDEO_DRIVER: dummy
          SDL_RENDER_DRIVER: software
      - name: Render gradient gallery
        run: dotnet run --project samples/Swealium.Sample -c Release --no-build -- --gradient-demo --smoke-test
        env:
          SDL_VIDEO_DRIVER: dummy
          SDL_RENDER_DRIVER: software
      - name: Render selectable text and custom editor
        run: dotnet run --project samples/Swealium.Sample -c Release --no-build -- --selection-demo --smoke-test
        env:
          SDL_VIDEO_DRIVER: dummy
          SDL_RENDER_DRIVER: software
      - name: Render collection list and nested focus demo
        run: dotnet run --project samples/Swealium.Sample -c Release --no-build -- --list-demo --smoke-test
        env:
          SDL_VIDEO_DRIVER: dummy
          SDL_RENDER_DRIVER: software
      - name: Render transforms and overscroll policies
        run: dotnet run --project samples/Swealium.Sample -c Release --no-build -- --transform-demo --smoke-test
        env:
          SDL_VIDEO_DRIVER: dummy
          SDL_RENDER_DRIVER: software
      - name: Render pointer ghosts and outline styles
        run: dotnet run --project samples/Swealium.Sample -c Release --no-build -- --outline-demo --smoke-test
        env:
          SDL_VIDEO_DRIVER: dummy
          SDL_RENDER_DRIVER: software
      - name: Render 100K-point immediate canvas
        run: dotnet run --project samples/Swealium.Sample -c Release --no-build -- --canvas-demo --smoke-test
        env:
          SDL_VIDEO_DRIVER: dummy
          SDL_RENDER_DRIVER: software
      - name: Render widget effects and backdrop blur
        run: dotnet run --project samples/Swealium.Sample -c Release --no-build -- --effects-demo --smoke-test
        env:
          SDL_VIDEO_DRIVER: dummy
          SDL_RENDER_DRIVER: software
      - name: Run animator context and playback controls
        run: dotnet run --project samples/Swealium.Sample -c Release --no-build -- --animation-demo --smoke-test
        env:
          SDL_VIDEO_DRIVER: dummy
          SDL_RENDER_DRIVER: software
      - name: Render explicitly triggered ripple effects
        run: dotnet run --project samples/Swealium.Sample -c Release --no-build -- --ripple-demo --smoke-test
        env:
          SDL_VIDEO_DRIVER: dummy
          SDL_RENDER_DRIVER: software
      - name: Render loaded Aldo font and shaped text
        run: dotnet run --project samples/Swealium.Sample -c Release --no-build -- --font-demo --smoke-test
        env:
          SDL_VIDEO_DRIVER: dummy
          SDL_RENDER_DRIVER: software
      - name: Pack library and symbols
        run: dotnet pack src/Swealium -c Release --no-build -o artifacts/packages
      - name: Verify package metadata and dependency contract
        run: python tools/check_package.py artifacts/packages
      - name: Install and run a consumer using only the package
        shell: pwsh
        run: |
          [xml]$project = Get-Content src/Swealium/Swealium.csproj
          $version = $project.Project.PropertyGroup.Version | Where-Object { $_ }
          dotnet restore tests/Swealium.PackageSmoke --configfile tests/Swealium.PackageSmoke/NuGet.Config -p:SwealiumPackageVersion=$version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet run --project tests/Swealium.PackageSmoke -c Release --no-restore -p:SwealiumPackageVersion=$version
          exit $LASTEXITCODE
        env:
          SDL_VIDEO_DRIVER: dummy
          SDL_RENDER_DRIVER: software
